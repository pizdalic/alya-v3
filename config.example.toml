# Скопируйте в config.toml. Секреты сюда НЕ писать — только в .env.

[app]
timezone = "Asia/Yekaterinburg"
language = "ru"
data_dir = "runtime"
# owner_user_id = 123456789   # Telegram id владельца

[telegram]
mode = "userbot"              # userbot | bot | none
session_dir = "runtime/td_database"
# database_encryption_key — секрет, только через ALYA_TELEGRAM__DATABASE_ENCRYPTION_KEY
alya_names = ["аля", "алька", "алечка", "алюша", "алюшка"]
debounce_s = 2.0               # склейка быстрых сообщений подряд
debounce_max_wait_s = 8.0
thread_ttl_s = 300             # сколько живёт «нить» разговора в группе без реплая
group_context_hours = 48       # чужие сообщения в группах хранятся 24–72 ч
private_history_days = 30
strangers = "known"            # known (контакты и общие группы) | all | owner_only
gray_zone_llm = true           # спорные случаи «это мне?» решает модель utility
replies_per_10min = 20         # на собеседника в чате, владелец без лимита
chat_send_interval_s = 1.0
typing_chars_per_s = 12
max_typing_delay_s = 6

[llm]
base_url = "https://openrouter.ai/api/v1"
timeout_s = 60

# Роли моделей: chat, utility, embedding, vision, stt, tts, image.
# У роли можно указать свой base_url.
# [llm.roles.chat]
# model = "provider/model"
# [llm.roles.embedding]
# model = "provider/embedding-model"

[storage]
db_path = "runtime/alya.sqlite3"
busy_timeout_ms = 5000

[health]
enabled = true
host = "127.0.0.1"
port = 8080

[logging]
level = "INFO"
format = "json"               # json | text

[memory]
mirror_enabled = true               # Markdown-зеркало только для чтения
mirror_dir = "runtime/memory"
working_ttl_hours = 6
short_ttl_days = 14
rrf_k = 60
search_candidates = 50
recency_half_life_days = 90
vector_backend = "numpy"            # numpy | sqlite_vec (нужен pip install .[vec])
embedding_batch = 32
maintenance_interval_s = 300

[dream]
enabled = true                     # фоновая консолидация памяти
use_llm = true                     # слияние формулировок и поиск противоречий моделью utility (или chat)
hour_local = 4                     # ночной прогон после этого часа по app.timezone
check_interval_s = 600
new_memories_threshold = 200       # внеплановый прогон, если накопилось столько новых записей
min_gap_hours = 6
dup_threshold = 0.90               # похожесть для кластера (косинус эмбеддингов или пересечение слов)
exact_threshold = 0.97             # явный дубль: сливается без LLM
related_threshold = 0.60           # похожие, но не дубли: проверка на противоречие
max_cluster = 8
max_clusters_per_run = 50
max_pairs_per_run = 40
stale_days = 60                    # долговременный факт без использования теряет уверенность
decay_step = 0.1
confidence_floor = 0.2
contradiction_factor = 0.6         # множитель уверенности для опровергнутой записи
retention_days = 30                # сколько хранить заменённые источники

[character]
dir = "character"            # канонические файлы персонажа
persona = "shy"              # характер: shy (стеснительная) | tsundere (цундере)
context_budget_tokens = 6000 # бюджет контекста на один ответ
recall_k = 8                 # сколько воспоминаний подтягивать
temperature = 0.9
max_reply_tokens = 400

[media]
# Модели задаются в [llm.roles.vision|stt|tts|image]; нет роли — функция выключена.
# Веб-поиск идёт через роль utility (или chat) с плагином web OpenRouter.
vision = true
stt = true
tts = true
images = true
stickers = true
reactions = true
web_search = true
stt_api = "chat"              # chat (input_audio, OpenRouter) | transcriptions (/audio/transcriptions)
tts_voice = "nova"
max_image_bytes = 10485760     # 10 МБ
max_voice_seconds = 120
max_voice_bytes = 20971520
media_dir = "runtime/media"
web_search_results = 3
selfie_private_only = true     # «селфи» только в личке

[media.per_hour]               # 0 — выключить вид
vision = 30
stt = 30
tts = 10
image = 3
search = 10
reaction = 60
sticker = 30

[media.per_day]
vision = 200
stt = 200
tts = 40
image = 10
search = 60

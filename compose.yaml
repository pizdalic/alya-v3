services:
  alya:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: alya:local
    restart: unless-stopped
    env_file: .env
    environment:
      ALYA_CONFIG: /app/config.toml
    volumes:
      - ./runtime:/app/runtime
      - ./config.toml:/app/config.toml:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

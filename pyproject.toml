[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "alya"
version = "0.1.0"
description = "Аля — Telegram-компаньон"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["pydantic>=2.7,<3", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
vec = ["sqlite-vec>=0.1.9"]
tg = ["tdjson>=1.8.69,<1.9"]

[project.scripts]
alya = "alya.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alya"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["alya"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["alya"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
